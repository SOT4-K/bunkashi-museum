name: Deploy nihonshi-bunka to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "nihonshi-bunka/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nihonshi-bunka/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 26 は GitHub ランナーでの対応が未確認のため、LTS の 24 に固定する
          node-version: 24
          cache: npm
          cache-dependency-path: nihonshi-bunka/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # GitHub Pages はリポジトリ名のサブパスに配信されるため base を合わせる
          VITE_BASE: /${{ github.event.repository.name }}/
          # M2（2026-09-04）で撤去: status: reviewed のみ本番に含める（decisions.md 2026-09-03）。
          # reviewer の事実検証を通っていない draft を公開しない
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nihonshi-bunka/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
